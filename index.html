
<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>លំហាត់លីមីតត្រៀមប្រឡង - លោកគ្រូ រស់ មករា</title>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Khmer OS Battambang', sans-serif; display: flex; justify-content: center; padding: 20px; background: #f4f4f9; }
        .box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 650px; text-align: center; }
        .math { font-size: 28px; margin: 25px 0; color: #1a73e8; min-height: 80px; display: flex; align-items: center; justify-content: center; overflow-x: auto;}
        .author { font-size: 14px; color: #777; margin-bottom: 20px; font-style: italic; }
        .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        select { padding: 10px; width: 100%; border-radius: 5px; border: 1px solid #ccc; font-family: inherit; font-size: 15px; outline: none; }
        select:focus { border-color: #1a73e8; }
        
        #subType { display: none; background-color: #f1f8ff; border-color: #1a73e8; } 

        input { padding: 12px; width: 120px; font-size: 18px; border: 2px solid #ccc; border-radius: 5px; text-align: center; outline: none; transition: 0.3s; }
        input:focus { border-color: #1a73e8; }
        button { padding: 12px 20px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; font-family: inherit; transition: 0.3s; }
        button:hover { background: #218838; }
        .btn-new { background: #6c757d; margin-top: 15px; width: 100%; }
        .btn-new:hover { background: #5a6268; }
        #feedback { font-size: 18px; font-weight: bold; margin-top: 15px; min-height: 27px; }
        .special-note { font-size: 14px; color: #dc3545; background: #ffeeba; padding: 8px; border-radius: 5px; margin-bottom: 15px; display: none; font-weight: bold;}
    </style>
</head>
<body>

<div class="box">
    <h2>ប្រព័ន្ធលំហាត់លីមីតត្រៀមប្រឡង</h2>
    <div class="author">រៀបរៀងដោយ៖ លោកគ្រូ រស់ មករា</div>
    
    <div class="controls">
        <select id="limitType" onchange="newProblem()">
            <option value="bacii" style="font-weight: bold; background: #e8f0fe; color: #1a73e8;">៩. វិញ្ញាសាប្រឡងបាក់ឌុប (ចម្រុះ)</option>
            <option value="0">១. លីមីតជំនួសលេខផ្ទាល់</option>
            <option value="1">២. រាងមិនកំណត់ ០/០</option>
            <option value="2">៣. រាងមិនកំណត់ ∞/∞</option>
            <option value="3">៤. រាងមិនកំណត់ ០ × ∞</option>
            <option value="4">៥. រាងមិនកំណត់ ∞ - ∞</option>
            <option value="5">៦. រាងមិនកំណត់ 1^∞</option>
            <option value="6">៧. រាងមិនកំណត់ 0^0</option>
            <option value="7">៨. រាងមិនកំណត់ ∞^0</option>
        </select>

        <select id="subType" onchange="newProblem()">
            <option value="rational">ក. អនុគមន៍សនិទាន (ភាគយក/ភាគបែង)</option>
            <option value="trigo">ខ. អនុគមន៍ត្រីកោណមាត្រ (Sin, Tan)</option>
            <option value="radical">គ. អនុគមន៍មានរ៉ាឌីកាល់ (គុណកន្សោមឆ្លាស់)</option>
            <option value="1_minus_cos">ឃ. ត្រីកោណមាត្រមាន 1 - cos(ax)</option>
            <option value="trigo_x_to_a">ង. ត្រីកោណមាត្រ x → a (តាងអថេរថ្មី)</option>
        </select>
    </div>

    <div class="special-note" id="specialNote">
        📌 បញ្ជាក់៖ ប្រសិនបើចម្លើយគឺ $$e^k$$ សូមវាយបញ្ចូលតែតម្លៃនិទស្សន្តលេខ $$k$$ ប៉ុណ្ណោះ។
    </div>

    <div class="math" id="problem">កំពុងផ្ទុក...</div>
    
    <input type="number" id="answer" placeholder="ចម្លើយ">
    <button onclick="check()">ផ្ទៀងផ្ទាត់</button>
    
    <div id="feedback"></div>
    <button class="btn-new" onclick="newProblem()">លំហាត់ថ្មី</button>
</div>

<script>
    let correctAnswer;

    function makePoly(a, b, c) {
        let str = "";
        if (a !== 0) {
            if (a === 1) str += "x^2";
            else if (a === -1) str += "-x^2";
            else str += a + "x^2";
        }
        if (b !== 0) {
            let bStr = Math.abs(b) === 1 ? "x" : Math.abs(b) + "x";
            if (str === "") str += (b > 0 ? bStr : "-" + bStr);
            else str += (b > 0 ? " + " + bStr : " - " + bStr);
        }
        if (c !== 0) {
            if (str === "") str += c;
            else str += (c > 0 ? " + " + c : " - " + Math.abs(c));
        }
        return str === "" ? "0" : str;
    }

    function newProblem() {
        let type = document.getElementById('limitType').value;
        let subType = document.getElementById('subType').value;
        let subTypeSelect = document.getElementById('subType');
        let note = document.getElementById('specialNote');
        
        let tex = "";
        
        subTypeSelect.style.display = (type === '1') ? "block" : "none";
        note.style.display = (type >= 5 && type !== 'bacii') ? "block" : "none";

        if (type === 'bacii') {
            // វិញ្ញាសាបាក់ឌុប (Random 4 ទម្រង់ពេញនិយម)
            let baciiCat = Math.floor(Math.random() * 4);
            
            if (baciiCat === 0) { 
                // អិចស្ប៉ូណង់ស្យែល (e^ax - e^bx)/x
                let a = Math.floor(Math.random() * 7) - 3;
                if (a === 0) a = 4;
                let b = Math.floor(Math.random() * 7) - 3;
                while (a === b) b = Math.floor(Math.random() * 7) - 3;
                
                let aStr = a === 1 ? "x" : (a === -1 ? "-x" : a + "x");
                let bStr = b === 1 ? "x" : (b === -1 ? "-x" : b + "x");
                let e1 = `e^{${aStr}}`;
                let e2 = b === 0 ? "1" : `e^{${bStr}}`;
                
                tex = `\\lim_{x \\to 0} \\frac{${e1} - ${e2}}{x}`;
                correctAnswer = a - b;
                
            } else if (baciiCat === 1) { 
                // ឡូការីតនេពែ ln(1+ax)/x
                let a = Math.floor(Math.random() * 9) - 4;
                if (a === 0) a = 5;
                let term = a > 0 ? `+ ${a===1?'':a}x` : `- ${Math.abs(a)===1?'':Math.abs(a)}x`;
                
                tex = `\\lim_{x \\to 0} \\frac{\\ln(1 ${term})}{x}`;
                correctAnswer = a;
                
            } else if (baciiCat === 2) { 
                // ត្រីកោណមាត្រ x -> a (តាងអថេរ)
                let a = Math.floor(Math.random() * 5) + 1; 
                let ans = Math.floor(Math.random() * 7) - 3; 
                if (ans === 0) ans = 2;
                
                let numInner = makePoly(0, ans, -ans * a);
                let denInner = makePoly(0, 1, -a);
                tex = `\\lim_{x \\to ${a}} \\frac{\\sin(${numInner})}{${denInner}}`;
                correctAnswer = ans;
                
            } else if (baciiCat === 3) { 
                // រ៉ាឌីកាល់កន្សោមឆ្លាស់
                let ans = Math.floor(Math.random() * 6) - 3;
                if (ans === 0) ans = 2;
                let c = Math.floor(Math.random() * 3) + 1; 
                let a = 2 * c * Math.abs(ans); 
                let x0 = Math.floor(Math.random() * 5) + 1;
                let b = c * c - a * x0;
                
                let inner = (a === 1 ? "x" : a + "x") + (b === 0 ? "" : (b > 0 ? " + " + b : " - " + Math.abs(b)));
                let den = "x" + (x0 === 0 ? "" : (x0 > 0 ? " - " + x0 : " + " + Math.abs(x0)));
                
                if (ans > 0) {
                    tex = `\\lim_{x \\to ${x0}} \\frac{\\sqrt{${inner}} - ${c}}{${den}}`;
                } else {
                    tex = `\\lim_{x \\to ${x0}} \\frac{${c} - \\sqrt{${inner}}}{${den}}`;
                }
                correctAnswer = ans;
            }

        } else if (type === '0') { 
            let x0 = Math.floor(Math.random() * 7) - 3; 
            let a = Math.floor(Math.random() * 5) - 2;
            let b = Math.floor(Math.random() * 10) - 5;
            let c = Math.floor(Math.random() * 10) - 5;
            if(a === 0 && b === 0) b = 2; 
            let poly = makePoly(a, b, c);
            tex = `\\lim_{x \\to ${x0}} \\left( ${poly} \\right)`;
            correctAnswer = (a * x0 * x0) + (b * x0) + c;

        } else if (type === '1') { 
            if (subType === 'rational') {
                let x0 = Math.floor(Math.random() * 10) - 5;
                let root2 = Math.floor(Math.random() * 10) - 5;
                while(x0 === root2) root2 = Math.floor(Math.random() * 10) - 5;
                let k = Math.floor(Math.random() * 3) + 1;
                let num = makePoly(k, -k * (x0 + root2), k * x0 * root2);
                let den = makePoly(0, 1, -x0);
                tex = `\\lim_{x \\to ${x0}} \\frac{${num}}{${den}}`;
                correctAnswer = k * (x0 - root2);
                
            } else if (subType === 'trigo') {
                let b = Math.floor(Math.random() * 5) + 1; 
                let ans = Math.floor(Math.random() * 11) - 5; 
                if (ans === 0) ans = 2;
                let a = ans * b;
                let aStr = (a === 1) ? "" : ((a === -1) ? "-" : a);
                let bStr = (b === 1) ? "" : ((b === -1) ? "-" : b);
                let trigType = Math.floor(Math.random() * 3);
                if (trigType === 0) tex = `\\lim_{x \\to 0} \\frac{\\sin(${aStr}x)}{${bStr}x}`;
                else if (trigType === 1) tex = `\\lim_{x \\to 0} \\frac{\\tan(${aStr}x)}{${bStr}x}`;
                else tex = `\\lim_{x \\to 0} \\frac{\\sin(${aStr}x)}{\\tan(${bStr}x)}`;
                correctAnswer = ans;
                
            } else if (subType === 'radical') {
                let ans = Math.floor(Math.random() * 8) - 4;
                if (ans === 0) ans = 3;
                let c = Math.floor(Math.random() * 3) + 1; 
                let a = 2 * c * Math.abs(ans); 
                let x0 = Math.floor(Math.random() * 7) - 3;
                let b = c * c - a * x0;
                let inner = (a === 1 ? "x" : a + "x") + (b === 0 ? "" : (b > 0 ? " + " + b : " - " + Math.abs(b)));
                let den = "x" + (x0 === 0 ? "" : (x0 > 0 ? " - " + x0 : " + " + Math.abs(x0)));
                if (ans > 0) tex = `\\lim_{x \\to ${x0}} \\frac{\\sqrt{${inner}} - ${c}}{${den}}`;
                else tex = `\\lim_{x \\to ${x0}} \\frac{${c} - \\sqrt{${inner}}}{${den}}`;
                correctAnswer = ans;
                
            } else if (subType === '1_minus_cos') {
                let options = [ [2, 1, 2], [2, 2, 1], [2, -1, -2], [2, -2, -1], [4, 2, 4], [4, 4, 2], [4, -2, -4], [4, 1, 8], [6, 2, 9], [6, 3, 6], [6, -3, -6] ];
                let pick = options[Math.floor(Math.random() * options.length)];
                let B_str = (pick[1] === 1) ? "" : ((pick[1] === -1) ? "-" : pick[1]);
                tex = `\\lim_{x \\to 0} \\frac{1 - \\cos(${pick[0]}x)}{${B_str} x^2}`;
                correctAnswer = pick[2];
                
            } else if (subType === 'trigo_x_to_a') {
                let a = Math.floor(Math.random() * 9) - 4; 
                if (a === 0) a = 3; 
                let B = Math.floor(Math.random() * 3) + 1; 
                let ans = Math.floor(Math.random() * 11) - 5; 
                if (ans === 0) ans = 4;
                let A = ans * B; 
                let numInner = makePoly(0, A, -A * a);
                let denInner = makePoly(0, B, -B * a);
                let trigFunc = Math.floor(Math.random() * 2) === 0 ? "\\sin" : "\\tan";
                tex = `\\lim_{x \\to ${a}} \\frac{${trigFunc}(${numInner})}{${denInner}}`;
                correctAnswer = ans;
            }

        } else if (type === '2') { 
            let sign = Math.random() > 0.5 ? "+\\infty" : "-\\infty";
            let den_a = Math.floor(Math.random() * 4) + 1; 
            let ans = Math.floor(Math.random() * 11) - 5; 
            let num = makePoly(den_a * ans, Math.floor(Math.random() * 10) - 5, 0);
            let den = makePoly(den_a, Math.floor(Math.random() * 10) - 5, 0);
            tex = `\\lim_{x \\to ${sign}} \\frac{${num}}{${den}}`;
            correctAnswer = ans;

        } else if (type === '3') { 
            let b = Math.floor(Math.random() * 5) + 1;
            let ans = Math.floor(Math.random() * 9) - 4; 
            if (ans === 0) ans = 3;
            let a = ans * b;
            let a_str = a === 1 ? "" : (a === -1 ? "-" : a);
            let b_str = b === 1 ? "" : b;
            tex = `\\lim_{x \\to 0} \\left( \\sin(${a_str}x) \\cdot \\cot(${b_str}x) \\right)`;
            correctAnswer = ans;

        } else if (type === '4') { 
            let a = Math.floor(Math.random() * 10) - 5;
            let b = Math.floor(Math.random() * 10) - 5;
            while(a === b) b = Math.floor(Math.random() * 10) - 5;
            let termA = 2 * a === 0 ? "" : (2 * a > 0 ? `+ ${2*a}x` : `- ${Math.abs(2*a)}x`);
            let termB = 2 * b === 0 ? "" : (2 * b > 0 ? `+ ${2*b}x` : `- ${Math.abs(2*b)}x`);
            tex = `\\lim_{x \\to +\\infty} \\left( \\sqrt{x^2 ${termA}} - \\sqrt{x^2 ${termB}} \\right)`;
            correctAnswer = a - b;

        } else if (type === '5') { 
            let a = Math.floor(Math.random() * 5) + 1;
            if (Math.random() > 0.5) a = -a;
            let b = Math.floor(Math.random() * 4) + 1;
            if (Math.random() > 0.5) b = -b;
            let signA = a > 0 ? `+ ${a}x` : `- ${Math.abs(a)}x`;
            tex = `\\lim_{x \\to 0} (1 ${signA})^{\\frac{${b}}{x}}`;
            correctAnswer = a * b; 

        } else if (type === '6') { 
            let a = Math.floor(Math.random() * 9) - 4;
            if (a === 0) a = 2;
            tex = `\\lim_{x \\to 0^+} x^{\\frac{${a}}{\\ln x}}`;
            correctAnswer = a; 

        } else if (type === '7') { 
            let a = Math.floor(Math.random() * 9) - 4;
            if (a === 0) a = 3;
            tex = `\\lim_{x \\to +\\infty} x^{\\frac{${a}}{\\ln x}}`;
            correctAnswer = a; 
        }

        document.getElementById('problem').innerHTML = `$$${tex}$$`;
        MathJax.typesetPromise();
        
        document.getElementById('feedback').innerText = "";
        document.getElementById('answer').value = "";
        document.getElementById('answer').focus();
    }

    function check() {
        let userAns = document.getElementById('answer').value;
        let feedback = document.getElementById('feedback');
        
        if(userAns !== "" && parseInt(userAns) === correctAnswer) {
            feedback.innerHTML = "✓ ត្រឹមត្រូវ! ពូកែណាស់";
            feedback.style.color = "#28a745";
        } else if (userAns === "") {
            feedback.innerHTML = "សូមបញ្ចូលចម្លើយ!";
            feedback.style.color = "#dc3545";
        } else {
            feedback.innerHTML = `✗ ខុសហើយ! ចម្លើយត្រឹមត្រូវគឺ ${correctAnswer}`;
            feedback.style.color = "#dc3545";
        }
    }

    document.getElementById('answer').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') check();
    });

    newProblem();
</script>

</body>
</html>
